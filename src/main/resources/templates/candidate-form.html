<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>候補者登録・編集</title>
</head>
<body>

    <h1 th:text="${candidate.id != null ? '候補者編集' : '候補者登録'}">
        候補者登録
    </h1>

    <form th:action="${candidate.id != null ? '/candidates/' + candidate.id : '/candidates'}"
      method="post"
      th:object="${candidate}">

      <input type="hidden" th:field="*{id}">

        <p>
            <label>氏名：</label>
            <input type="text" th:field="*{name}">
        </p>

        <p th:if="${#fields.hasErrors('name')}"
        th:errors="*{name}">
        </p>

        <p>
            <label>応募職種：</label>
            <input type="text"
                   name="position"
                   th:value="${candidate != null ? candidate.position : ''}">
        </p>

        <p>
            <label>選考状況：</label>
            <select name="status">
                <option th:selected="${candidate != null and candidate.status == '書類選考'}">
                    書類選考
                </option>
                <option th:selected="${candidate != null and candidate.status == '一次面接'}">
                    一次面接
                </option>
                <option th:selected="${candidate != null and candidate.status == '二次面接'}">
                    二次面接
                </option>
                <option th:selected="${candidate != null and candidate.status == '内定'}">
                    内定
                </option>
            </select>
        </p>

        <button type="submit"
                th:text="${candidate.id != null ? '更新' : '登録'}">
            登録
        </button>

    </form>

    <br>

    <a th:href="@{/candidates}">候補者一覧へ戻る</a>

</body>
</html>
