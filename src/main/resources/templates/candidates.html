<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>候補者一覧</title>
</head>
<body>

    <h1>候補者一覧</h1>

    <form action="/candidates" method="get">

        <label>選考状況：</label>

        <select name="status">
            <option value="">すべて</option>

            <option value="書類選考"
                    th:selected="${selectedStatus == '書類選考'}">
                書類選考
            </option>

            <option value="一次面接"
                    th:selected="${selectedStatus == '一次面接'}">
                一次面接
            </option>

            <option value="二次面接"
                    th:selected="${selectedStatus == '二次面接'}">
                二次面接
            </option>

            <option value="内定"
                    th:selected="${selectedStatus == '内定'}">
                内定
            </option>
        </select>

        <button type="submit">検索</button>

    </form>

    <br>

    <table border="1">
        <thead>
            <tr>
                <th>氏名</th>
                <th>応募職種</th>
                <th>選考状況</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="candidate : ${candidates}">
                <td th:text="${candidate.name}"></td>
                <td th:text="${candidate.position}"></td>
                <td th:text="${candidate.status}"></td>

                <td>
                    <a th:href="@{/candidates/{id}(id=${candidate.id})}">
                        詳細
                    </a>

                    <a th:href="@{/candidates/{id}/edit(id=${candidate.id})}">
                        編集
                    </a>

                    <form th:action="@{/candidates/{id}/delete(id=${candidate.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a href="/">トップページへ戻る</a>

</body>
</html>
