<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>

<h1>ユーザー登録</h1>

<form th:action="@{/users}" th:object="${user}" method="post">

    <div>
        <label>ユーザー名：</label>
        <input type="text" th:field="*{username}">
    </div>

    <div>
        <label>パスワード：</label>
        <input type="password" th:field="*{password}">
    </div>

    <button type="submit">登録</button>

</form>

</body>
</html>
